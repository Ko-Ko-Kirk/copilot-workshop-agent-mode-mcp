<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <div class="card-header">
      <h1>待辦清單</h1>
      <!-- 深色模式切換按鈕 -->
      <button type="button" id="theme-toggle" class="btn-theme-toggle" aria-label="切換深色模式">🌙</button>
    </div>

    <!-- 新增待辦事項的表單 -->
    <form id="todo-form" class="todo-form">
      <input
        type="text"
        id="todo-input"
        class="todo-input"
        placeholder="輸入待辦事項..."
        autocomplete="off"
      />
      <button type="submit" class="btn-add">新增</button>
    </form>

    <!-- 篩選按鈕：全部／未完成／已完成 -->
    <div class="todo-filters" id="todo-filters">
      <button type="button" class="filter-btn active" data-filter="all">全部</button>
      <button type="button" class="filter-btn" data-filter="active">未完成</button>
      <button type="button" class="filter-btn" data-filter="completed">已完成</button>
    </div>

    <!-- 待辦事項清單 -->
    <ul id="todo-list" class="todo-list"></ul>

    <!-- 清單為空時顯示的提示文字 -->
    <p id="empty-hint" class="empty-hint">還沒有任何待辦事項,新增一個吧!</p>

    <!-- 底部顯示未完成的數量 -->
    <footer class="todo-footer">
      <span id="remaining-count">未完成:0 項</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
